name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: Build plugin (.NET Framework 4.8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build vPilot plugin API stub
        # The real RossCarlson.Vatsim.Vpilot.Plugins.dll isn't redistributed (see
        # plugin/README.md), so CI builds against a hand-reconstructed public-API-only
        # stub instead (see ci/plugin-stub-ref/README.md) and drops it into plugin/lib/
        # where the HintPath reference expects it.
        run: |
          dotnet build ci/plugin-stub-ref/StubRef.csproj -o ci/plugin-stub-ref/out
          New-Item -ItemType Directory -Force -Path plugin/lib | Out-Null
          Copy-Item ci/plugin-stub-ref/out/RossCarlson.Vatsim.Vpilot.Plugins.dll plugin/lib/
        shell: pwsh

      - name: Build
        run: dotnet build plugin/Handoff.Plugin.csproj
        shell: pwsh

      - name: Build RadioHost
        run: dotnet build plugin/Handoff.RadioHost/Handoff.RadioHost.csproj
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build plugin (Release, for installer sources)
        run: dotnet build plugin/Handoff.Plugin.csproj -c Release -o plugin/publish/plugin
        shell: pwsh

      - name: Build RadioHost (Release, for installer sources)
        run: dotnet build plugin/Handoff.RadioHost/Handoff.RadioHost.csproj -c Release -o plugin/publish/plugin/RadioHost
        shell: pwsh

      - name: Compile installer (sanity check, not published)
        shell: pwsh
        run: |
          $sourceDir = Join-Path $pwd "plugin\publish\plugin"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=0.0.0-ci /DSourceDir="$sourceDir" plugin/installer/Handoff-Setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe failed with exit code $LASTEXITCODE" }

      - name: Test
        run: dotnet test plugin/Handoff.Plugin.Tests/Handoff.Plugin.Tests.csproj
        shell: pwsh

  android:
    name: Build android (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Task-output build cache entries are the bigger win for a mostly-unchanged codebase --
          # dependency/wrapper caching alone (the setup-java `cache: gradle` option) still re-runs
          # every compile/lint/resource task from scratch each run. This action handles both,
          # plus safe cache save/restore across runs without manual key management. Requires
          # org.gradle.caching=true in gradle.properties to actually populate the build cache.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Test
        working-directory: android
        run: ./gradlew test --no-daemon
