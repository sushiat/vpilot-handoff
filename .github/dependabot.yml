version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/plugin"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/plugin/Handoff.Plugin.Tests"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/plugin/Handoff.RadioHost"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/plugin/Handoff.ReplayTool"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    groups:
      android-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
