name: Bug report
description: Something isn't working right
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to VATSIM at ...
        2. Tune ...
        3. ...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: false

  - type: dropdown
    id: simulator
    attributes:
      label: Simulator
      options:
        - MSFS 2020
        - MSFS 2024
        - Other (untested -- Handoff.RadioHost targets modern SimConnect only, see plugin/README.md)
    validations:
      required: true

  - type: input
    id: vpilot-version
    attributes:
      label: vPilot version
      placeholder: e.g. 3.12.1
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Handoff plugin version
      description: Shown in the Android app's bottom drawer (next to "vPilot plugin"), the plugin's release zip filename, or plugin/Handoff.Plugin.csproj if built from source.
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: input
    id: android-app-version
    attributes:
      label: Handoff Android app version
      description: Shown top-right of the app's header row (next to the "Handoff" title), or check the APK filename.
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: input
    id: android-device
    attributes:
      label: Android device + OS version
      placeholder: e.g. Samsung Galaxy Tab S10, Android 15
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, `PostDebugMessage` output (vPilot launched with `/dbgwin`), anything else useful.
    validations:
      required: false
