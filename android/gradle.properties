org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
# Lets CI (gradle/actions/setup-gradle) skip unchanged compile/lint/resource tasks entirely by
# restoring their cached output instead of re-running them -- the bigger win over dependency
# caching alone for a mostly-unchanged codebase.
org.gradle.caching=true
